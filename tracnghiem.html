<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm 4 đáp án</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX: hiển thị công thức viết giữa hai dấu $ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0f2fe 100%);
            background-attachment: fixed;
            color: #4a4a4a;
            position: relative;
            z-index: 1;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#fbcfe8 4px, transparent 4px), radial-gradient(#c4b5fd 4px, transparent 4px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            z-index: -1;
            opacity: 0.4;
        }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .katex { font-size: 1.08em; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .flower { position: fixed; top: -10%; z-index: 100; font-size: 2rem; animation: fall linear forwards; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app"></div>
    <noscript>Trang này cần bật JavaScript để chạy.</noscript>
    <script>window.GAME_TYPE = 'mcq';</script>
    <script type="module" src="./quiz-core.js"></script>
</body>
</html>
